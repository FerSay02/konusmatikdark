<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-new.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Konuşmatik; Türkçe odaklı metinden sese, sesten metne, deşifre ve kurumsal local kurulum seçenekleri sunan yerli yapay zeka ses teknolojisi platformudur."
    />

    <title>Konuşmatik | Türkçe Seslendirme ve Deşifre Platformu</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('konusmatik-theme');
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
